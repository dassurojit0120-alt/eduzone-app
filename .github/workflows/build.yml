name: Build apps

# Put this file in your repo at:  .github/workflows/build.yml
# Release a new version by creating a tag, for example v1.0.0, v1.0.1, v1.1.0 ...
# Both the Android APK and the Windows installer are built and attached to the same release.
# You can also run it by hand from the Actions tab (the files are then kept as downloads in that run).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Version
        id: ver
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "name=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "name=0.0.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          fi

      - name: Install packages
        run: npm install --no-audit --no-fund

      - name: Prepare web files
        run: |
          mkdir -p www
          cp index.html style.css app.js manifest.json icon-192.png icon-512.png www/

      - name: Create Android project
        run: |
          npx cap add android
          npx cap sync android

      - name: Firebase push file (optional)
        env:
          GSJ: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GSJ" ]; then
            printf '%s' "$GSJ" > android/app/google-services.json
          else
            echo "::warning::GOOGLE_SERVICES_JSON secret is missing. Push notifications will not work."
          fi

      - name: App icon
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick
          RES=android/app/src/main/res
          rm -f $RES/mipmap-anydpi-v26/ic_launcher.xml $RES/mipmap-anydpi-v26/ic_launcher_round.xml
          for d in "mdpi 48" "hdpi 72" "xhdpi 96" "xxhdpi 144" "xxxhdpi 192"; do
            set -- $d
            for n in ic_launcher ic_launcher_round; do
              convert icon-512.png -resize ${2}x${2} $RES/mipmap-$1/$n.png
            done
          done

      - name: Set version
        run: |
          sed -i "s/versionCode 1/versionCode ${GITHUB_RUN_NUMBER}/; s/versionName \"1.0\"/versionName \"${{ steps.ver.outputs.name }}\"/" android/app/build.gradle
          grep -n "versionCode\|versionName" android/app/build.gradle

      - name: Build
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Sign APK
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          UNSIGNED=$(ls android/app/build/outputs/apk/release/*.apk | head -1)
          "$BT/zipalign" -p -f 4 "$UNSIGNED" aligned.apk
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > release.keystore
          else
            echo "::warning::No keystore secret. Signing with a temporary key: users must uninstall the old app before installing the next version."
            keytool -genkeypair -keystore release.keystore -storepass android -keypass android \
              -alias temp -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=EduZone"
            KEYSTORE_PASSWORD=android
            KEY_ALIAS=temp
            KEY_PASSWORD=android
          fi
          "$BT/apksigner" sign --ks release.keystore --ks-pass "pass:$KEYSTORE_PASSWORD" \
            --ks-key-alias "$KEY_ALIAS" --key-pass "pass:$KEY_PASSWORD" --out EduZone.apk aligned.apk
          "$BT/apksigner" verify EduZone.apk
          rm -f release.keystore

      - uses: actions/upload-artifact@v4
        with:
          name: EduZone-apk
          path: EduZone.apk

  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Version
        id: ver
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "name=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "name=0.0.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare app files
        run: |
          mkdir -p desktop/app desktop/build
          cp index.html style.css app.js manifest.json icon-192.png icon-512.png desktop/app/
          cp icon-512.png desktop/build/icon.png

      - name: Install packages
        working-directory: desktop
        run: |
          npm pkg set version="${{ steps.ver.outputs.name }}"
          npm install --no-audit --no-fund

      - name: Build installer
        working-directory: desktop
        run: npx electron-builder --win nsis --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: EduZone-exe
          path: desktop/dist/EduZone-Setup.exe

  release:
    needs: [android, windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: files
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            files/EduZone.apk
            files/EduZone-Setup.exe
          name: EduZone ${{ github.ref_name }}
          generate_release_notes: true
